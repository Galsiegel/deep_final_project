# Classification-specific configuration
# Inherits from base.yaml

task: classification

classification:
  num_classes: 5
  loss: cross_entropy
  
  # Class thresholds (% returns)
  # Defines boundaries between classes
  class_thresholds: [-2.0, -0.5, 0.5, 2.0]
  
  class_names:
    - Large Down      # < -2%
    - Small Down      # -2% to -0.5%
    - Neutral         # -0.5% to 0.5%
    - Small Up        # 0.5% to 2%
    - Large Up        # > 2%
  
  # Use class weights to handle imbalance
  use_class_weights: true
  
  # Metrics to track
  metrics:
    - accuracy
    - precision
    - recall
    - f1
  
  # Which metric to use for best_val_metric checkpoint
  best_metric: f1
  best_metric_mode: max

# Output
output:
  name: direction_class
  size: 5                   # 5 classes

